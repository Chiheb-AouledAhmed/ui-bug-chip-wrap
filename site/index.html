<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Jobs — Filters</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">HireLoop</div>
  <nav class="nav"><a href="#">Jobs</a><a href="#">Companies</a></nav>
</header>
<main class="content">
  <h1>Open Positions</h1>
  <div class="chip-row" id="chip-row">
    <button class="chip active">Remote</button>
    <button class="chip">Full-time</button>
    <button class="chip">React</button>
    <button class="chip">TypeScript</button>
    <button class="chip">Node.js</button>
    <button class="chip">Senior</button>
    <button class="chip">US-based</button>
  </div>
  <ul class="job-list">
    <li>Frontend Engineer — Acme Corp</li>
    <li>Backend Engineer — Nimbus Data</li>
    <li>Full-stack Developer — Loop Systems</li>
  </ul>
</main>
<script src="script.js"></script>
</body>
</html>
